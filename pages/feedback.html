<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback & Suggestions | Khategaon Local Guide</title>
  <meta name="description" content="Send feedback, report updates, or suggest new listings for Khategaon Local Guide (khategaon.in).">
  <meta name="theme-color" content="#155eef">
  <link rel="canonical" href="https://khategaon.github.io/pages/feedback.html">
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .feedback-page {
      padding-top: 45px;
      padding-bottom: 75px;
    }
    .feedback-hero {
      padding: 35px;
      border-radius: 22px;
      background: linear-gradient(120deg, #eef4ff, #f8faff);
      border: 1px solid #e1eaff;
      margin-bottom: 30px;
    }
    .feedback-hero h1 {
      font-size: clamp(32px, 5vw, 46px);
      letter-spacing: -1.8px;
      line-height: 1.15;
      margin: 10px 0;
    }
    .feedback-hero p {
      max-width: 650px;
      color: #63718a;
      margin-bottom: 0;
    }
    .feedback-container {
      background: #fff;
      border: 1px solid #e6ebf3;
      border-radius: 16px;
      padding: 32px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-weight: 650;
      font-size: 14px;
      color: #0f172a;
      margin-bottom: 8px;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      border: 1px solid #dfe6f1;
      border-radius: 11px;
      padding: 13px 15px;
      outline: none;
      background: #fff;
      font-family: inherit;
      font-size: 14px;
      color: #334155;
      transition: border-color .2s, box-shadow .2s;
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: #155eef;
      box-shadow: 0 0 0 3px #155eef18;
    }
    .form-group textarea {
      resize: vertical;
      min-height: 130px;
    }
    .btn-submit {
      background: #155eef;
      color: #fff;
      border: none;
      border-radius: 11px;
      padding: 14px 28px;
      font-size: 15px;
      font-weight: 750;
      cursor: pointer;
      transition: background .2s, transform .2s;
    }
    .btn-submit:hover {
      background: #0f46d4;
      transform: translateY(-1px);
    }
    @media (max-width: 520px) {
      .feedback-page {
        padding-top: 25px;
      }
      .feedback-hero {
        padding: 23px;
      }
      .feedback-container {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <div id="site-header"></div>
  <div id="site-navbar"></div>

  <main class="container feedback-page">
    <section class="feedback-hero">
      <span class="eyebrow">COMMUNITY</span>
      <h1>Send Us Feedback</h1>
      <p>Help us improve Khategaon Local Guide. Report incorrect details, suggest a new business listing, or share your thoughts.</p>
    </section>

    <div class="feedback-container">
      <!-- Replace 'your-form-id' with your actual Formspree form endpoint hash -->
      <form action="https://formspree.io/f/xvkznlnr" method="POST">
        <div class="form-group">
          <label for="name">Your Name</label>
          <input type="text" id="name" name="name" placeholder="Enter your full name" required>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label for="category">Feedback Type</label>
          <select id="category" name="category">
            <option value="listing-update">Suggest Listing Update / Correction</option>
            <option value="new-listing">Add New Business / Service</option>
            <option value="bug-issue">Report Website Bug / Issue</option>
            <option value="general">General Feedback</option>
          </select>
        </div>

        <div class="form-group">
          <label for="message">Your Message</label>
          <textarea id="message" name="message" placeholder="Provide details about your update, suggestion, or feedback..." required></textarea>
        </div>

        <button type="submit" class="btn-submit">Submit Feedback</button>
      </form>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="../assets/js/main.js" defer></script>
</body>
</html>
