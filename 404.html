<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | Khategaon Local Guide</title>
  <meta name="description" content="The page you are looking for could not be found on Khategaon Local Guide (khategaon.in).">
  <meta name="theme-color" content="#155eef">
  <link rel="canonical" href="https://khategaon.github.io/404.html">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .error-page {
      padding-top: 60px;
      padding-bottom: 90px;
      text-align: center;
    }
    .error-card {
      max-width: 650px;
      margin: 0 auto;
      padding: 45px 35px;
      background: linear-gradient(120deg, #eef4ff, #f8faff);
      border: 1px solid #e1eaff;
      border-radius: 22px;
    }
    .error-card h1 {
      font-size: clamp(64px, 10vw, 96px);
      letter-spacing: -3px;
      line-height: 1;
      color: #155eef;
      margin: 0 0 15px;
    }
    .error-card h2 {
      font-size: clamp(24px, 4vw, 32px);
      letter-spacing: -.8px;
      color: #0f172a;
      margin: 0 0 15px;
    }
    .error-card p {
      color: #63718a;
      font-size: 15px;
      line-height: 1.7;
      margin-bottom: 30px;
    }
    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #155eef;
      color: #fff;
      padding: 14px 28px;
      border-radius: 11px;
      font-weight: 750;
      text-decoration: none;
      transition: background .2s, transform .2s;
    }
    .btn-home:hover {
      background: #0f46d4;
      transform: translateY(-1px);
    }
    @media (max-width: 520px) {
      .error-page {
        padding-top: 30px;
        padding-bottom: 50px;
      }
      .error-card {
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>
  <div id="site-header"></div>
  <div id="site-navbar"></div>

  <main class="container error-page">
    <div class="error-card">
      <span class="eyebrow" style="margin-bottom: 10px; display: inline-block;">404 ERROR</span>
      <h1>404</h1>
      <h2>Page Not Found</h2>
      <p>Oops! The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
      <a href="index.html" class="btn-home">← Back to Homepage</a>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="assets/js/main.js" defer></script>
</body>
</html>
